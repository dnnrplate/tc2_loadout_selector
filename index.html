<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TC2 Loadout Selector</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img
        src="https://i.postimg.cc/tJfrtfZK/tc2-logo.webp"
        alt="TC2 Logo"
        id="logo"
    >

    <h1>Loadout Selector</h1>
</header>

<!-- Class Selection -->
<div id="classBar">
    <!-- Filled by script.js -->
</div>

<!-- Main Panel -->
<main id="mainPanel">

    <h2 id="classTitle">
        Select a Class
    </h2>

    <div id="weaponSlots">
        <!-- Filled by JS -->
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
